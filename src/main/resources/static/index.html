<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Soporte Técnico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Dashboard de Soporte Técnico</h1>

    <!-- Formulario para nueva solicitud -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Crear / Editar Solicitud</h5>
            <form id="formSolicitud">
                <input type="hidden" id="solicitudId">
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <input type="text" class="form-control" id="descripcion" required>
                </div>
                <div class="mb-3">
                    <label for="clienteId" class="form-label">Cliente (ID)</label>
                    <input type="number" class="form-control" id="clienteId" required>
                </div>
                <div class="mb-3">
                    <label for="tecnicoId" class="form-label">Técnico (ID)</label>
                    <input type="number" class="form-control" id="tecnicoId">
                </div>
                <div class="mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado">
                        <option value="Pendiente">Pendiente</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Completado">Completado</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" id="cancelarEdicion" class="btn btn-secondary">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Tabla de solicitudes -->
    <h3>Solicitudes</h3>
    <table class="table table-striped" id="tablaSolicitudes">
        <thead>
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Cliente</th>
            <th>Técnico</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="js/app.js"></script>
</body>
</html>
